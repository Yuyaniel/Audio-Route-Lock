name: 构建 APK

on:
  # 支持在 GitHub Actions 页面手动触发
  workflow_dispatch:
  # push 到任意分支都会自动触发
  push:

jobs:
  build:
    name: 构建 Debug / Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17（AGP 9.3 要求）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 项目没有 gradle wrapper，直接用 gradle-version 指定版本。
      # AGP 9.3.x 最低要求 Gradle 9.5.0。
      - name: 设置 Gradle 9.5.0（自动缓存依赖，加速下次构建）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-read-only: false

      - name: 安装 Android SDK 37 与 Build Tools 36
        run: |
          # 镜像自带的 sdkmanager 版本过旧，索引识别不了 2026 年的 android-37，
          # 改为直接下载官方最新 cmdline-tools 来安装（依次尝试可用版本号）。
          for VER in 13114758 11076708; do
            if curl -fsSL -o "$RUNNER_TEMP/cmdtools.zip" "https://dl.google.com/android/repository/commandlinetools-linux-${VER}_latest.zip"; then
              echo "使用官方 cmdline-tools ${VER}"
              break
            fi
          done
          rm -rf "$RUNNER_TEMP/cmdtools" && mkdir -p "$RUNNER_TEMP/cmdtools"
          unzip -q "$RUNNER_TEMP/cmdtools.zip" -d "$RUNNER_TEMP/cmdtools"
          SDKMANAGER="$RUNNER_TEMP/cmdtools/cmdline-tools/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          # 若正式版包名不同（preview 后缀 .0），自动回退重试
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37" "build-tools;36.0.0" \
            || "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"

      - name: 构建 APK
        run: gradle assembleDebug assembleRelease --no-daemon

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
